name: Sync Google Sheet -> CSV

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Telecharger le CSV depuis Google Sheets
        shell: bash
        run: |
          mkdir -p data
          SHEET_ID="1hfHiN4B_3uBmR9aXsAjEN2APMXGdZ95Li9aoeTbwmxo"
          GID="1142550905"
          URL="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}"
          echo "URL: ${URL}"
          wget --no-verbose -O data/besoins.csv "${URL}"
          echo "--- 5 premieres lignes ---"
          head -n 5 data/besoins.csv || true
          echo "--- Taille : $(wc -c < data/besoins.csv) octets ---"

      - name: Commiter si changement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/besoins.csv
          if git diff --staged --quiet; then
            echo "Pas de changement, rien a commiter."
          else
            git commit -m "Sync besoins.csv depuis Google Sheets [skip ci]"
            git push
            echo "OK : besoins.csv mis a jour."
          fi
