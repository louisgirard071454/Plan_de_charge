name: Sync Google Sheet -> CSV

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Télécharger le CSV depuis Google Sheets
        env:
          SHEET_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          mkdir -p data
          curl -sSLf "$SHEET_URL" -o data/besoins.csv
          echo "--- Contenu téléchargé (5 premières lignes) ---"
          head -n 5 data/besoins.csv || true
          echo "--- Taille : $(wc -c < data/besoins.csv) octets ---"

      - name: Commiter si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/besoins.csv
          if git diff --staged --quiet; then
            echo "Pas de changement, rien à commiter."
          else
            git commit -m "Sync besoins.csv depuis Google Sheets [skip ci]"
            git push
            echo "✓ besoins.csv mis à jour."
          fi
